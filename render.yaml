services:
  - type: web
    name: codeimpact-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
